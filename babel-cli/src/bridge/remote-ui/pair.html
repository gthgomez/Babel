<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b0d12"/>
  <link rel="stylesheet" href="/ui/styles.css"/>
  <title>Pair with Babel host</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/ui/" aria-label="Babel Remote home">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span><strong>Babel</strong><small>PAIR</small></span>
      </a>
    </header>
    <main>
      <section class="hero" aria-labelledby="pair-title">
        <p class="eyebrow">DEVICE PAIRING</p>
        <h1 id="pair-title">Connect this browser</h1>
        <p class="hero-copy">Approve this device on the host to receive a secure session cookie. No long-lived token is stored in the URL.</p>
      </section>
      <section class="surface workspace-card" aria-live="polite">
        <p id="pair-status" class="muted">Preparing pairing request…</p>
        <label for="device-label">Device name</label>
        <input id="device-label" autocomplete="off" placeholder="e.g. Pixel phone"/>
        <div class="button-row">
          <button id="pair-submit" class="button button-primary" type="button">Request pairing</button>
          <a id="pair-open-ui" class="button" href="/ui/">Open console</a>
        </div>
      </section>
    </main>
  </div>
  <script src="/ui/pair.js"></script>
</body>
</html>
