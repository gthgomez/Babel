# Diagnostic-only: Windows directory anchor acquisition timing (not production repair).
name: windows-directory-anchor-diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'babel-cli/scripts/diagnostics/**'
      - '.github/workflows/windows-directory-anchor-diagnostic.yml'

concurrency:
  group: windows-directory-anchor-diagnostic-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: windows anchor diagnostic (instance ${{ matrix.instance }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        instance: [0, 1]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Install dependencies
        working-directory: babel-cli
        run: npm ci --ignore-scripts
      - name: Run acquisition timing matrix
        working-directory: babel-cli
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/windows-anchor-diagnostic | Out-Null
          node scripts/diagnostics/windowsDirectoryAnchorAcquire.mjs --runner-instance ${{ matrix.instance }} --output-dir artifacts/windows-anchor-diagnostic
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-anchor-diagnostic-instance-${{ matrix.instance }}
          path: babel-cli/artifacts/windows-anchor-diagnostic/report-instance-${{ matrix.instance }}.json
          if-no-files-found: error
          retention-days: 14
