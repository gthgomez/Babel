          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @{ candidateHead = $head; checkout = $checkout; runId = '${{ github.run_id }}'; os = '${{ runner.os }}'; role
          = 'unit-shards' } | ConvertTo-Json > artifacts/ci-validation/identity.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Run complete unit shard
        id: unit_shard
        shell: pwsh
        working-directory: babel-cli
        run: >
          Remove-Item Env:NO_COLOR -ErrorAction SilentlyContinue

          $tapDir = Join-Path $env:RUNNER_TEMP 'babel-ci-unit'

          New-Item -ItemType Directory -Force $tapDir | Out-Null

          $tap = Join-Path $tapDir 'full.tap'

          node scripts/run_ci_unit_shard.mjs --shard-index ${{ matrix.shard }} --shard-count 4 2>&1 | Tee-Object -FilePath $tap

          $shardCode = $LASTEXITCODE

          New-Item -ItemType Directory -Force artifacts/ci-unit | Out-Null

          Copy-Item -Force $tap artifacts/ci-unit/full.tap

          exit $shardCode
      - name: Validate complete unit TAP inventory
        if: always() && steps.unit_shard.outcome != 'skipped' && steps.unit_shard.outcome != ''
        run: node scripts/summarize_required_tap.mjs unit artifacts/ci-unit
        working-directory: babel-cli
      - name: Upload complete unit selection and TAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-${{ matrix.os }}-${{ matrix.shard }}
          path: |-
            babel-cli/artifacts/ci-unit
            artifacts/ci-validation
          if-no-files-found: error
          retention-days: 7
  consumer-candidate:
    name: Build immutable npm candidate
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      source: ${{ steps.pack.outputs.source_sha }}
      archive: ${{ steps.pack.outputs.archive }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.19.0'
      - name: Install producer dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Validate, build and pack once
        id: pack
        run: npm run package:release
        working-directory: babel-cli
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      - name: Retain immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer-candidate
          path: artifacts/consumer-candidate
          if-no-files-found: error
  consumer-build-toolchains:
    name: Retained consumer build toolchain (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.0', '24.13.1', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Install build dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Retain source-build contract on every previous consumer toolchain
        run: npm run build
        working-directory: babel-cli
  consumer-artifact:
    name: consumer-artifact (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [consumer-candidate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.0', '24.13.1', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Retrieve the same immutable archive on every consumer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: consumer-candidate
          path: artifacts/consumer-candidate
      - name: Verify consumer artifact
        env:
          CONSUMER_ARCHIVE: ../artifacts/consumer-candidate/${{ needs.consumer-candidate.outputs.archive }}
          CONSUMER_DIGEST: ${{ needs.consumer-candidate.outputs.sha256 }}
          CONSUMER_SOURCE: ${{ needs.consumer-candidate.outputs.source }}
        shell: pwsh
        run: npm run test:consumer-artifact -- --archive "$env:CONSUMER_ARCHIVE" --manifest ../artifacts/consumer-candidate/manifest.json --expected-sha256 "$env:CONSUMER_DIGEST" --expected-source "$env:CONSUMER_SOURCE"
        working-directory: babel-cli
      - name: Upload verified preview and provenance
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer-package-${{ runner.os }}-node-${{ matrix.node }}
          path: artifacts/consumer-package
          if-no-files-found: error
          retention-days: 14
