# Standard hosted workloads; stable required names aggregate every dependency fail closed.
# Full architecture budgets are enforced on both operating systems after the combined owner split.
# No baseline or process-boundary grant is increased.
name: Public Release Gate
'on':
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run local public scrub
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/check-public-scrub.ps1 -Strict
      - name: Install pinned gitleaks
        shell: pwsh
        run: |
          $version = '8.30.1'
          $expectedSha256 = '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          $archiveName = "gitleaks_${version}_linux_x64.tar.gz"
          $executableName = 'gitleaks'
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installDir = Join-Path $env:RUNNER_TEMP "gitleaks-$version"
          $downloadUrl = "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archiveName}"

          Invoke-WebRequest -UseBasicParsing -Uri $downloadUrl -OutFile $archivePath
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archivePath).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "gitleaks checksum mismatch. Expected $expectedSha256 but got $actualSha256."
          }

          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          tar -xzf $archivePath -C $installDir
          "$installDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $installDir $executableName) version
      - name: Run required public secret scan
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/run-public-secret-scan.ps1 -RepoRoot . -Strict
          -RequireExternalScanner
  public-content-policy:
    name: public-content-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test public prevention gates
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/tests/test-public-prevention-gates.ps1
      - name: Check public content policy
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/check-public-content-policy.ps1 -RepoRoot .
      - name: Check canonical repository independence
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/check-canonical-independence.ps1 -RepoRoot .
      - name: Check campaign status consistency
        run: node tools/check-campaign-status.mjs
      - name: Public policy runtime matrix
        run: pwsh -NoProfile -ExecutionPolicy Bypass -Command "& './tools/tests/test-public-content-policy-runtime.ps1'"
  review-control-plane-contract:
    name: review-control-plane-contract
    runs-on: ubuntu-latest
    env:
      BABEL_TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Test trusted merge and evidence contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @(
            'tools/tests/test-agent-pr-gate-closure.ps1',
            'tools/tests/test-review-evidence-taxonomy.ps1',
            'tools/tests/test-agent-pr-merge.ps1'
          )) {
            pwsh -NoProfile -NonInteractive -File $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Test review policy, provenance, and merge-readiness contracts
        run: >
          npx tsx --no-warnings=ExperimentalWarning --test src/services/reviewControlPlaneParity.test.ts
          src/services/reviewPolicy.test.ts src/services/babelReviewSnapshot.test.ts
          src/services/mergeReadinessBroker.test.ts src/services/reviewIndependence.test.ts
          src/services/harnessReviewProtocol.test.ts src/services/independentReviewEvidenceV3.test.ts
          src/services/codexHarnessReview.test.ts src/services/openCodeHarnessReview.test.ts
          src/services/controllerMediatedHarnessReview.test.ts src/services/trustedReviewInstallation.test.ts
        working-directory: babel-cli
  policy-integrity:
    name: policy-integrity
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test policy integrity verifier
        run: node --test tools/tests/policy-integrity-manifest.test.mjs
      - name: Verify policy integrity manifest
        run: node tools/policy-integrity-manifest.mjs verify
  public-pr-metadata-tests:
    name: public-pr-metadata-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test public PR metadata policy
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/tests/test-public-pr-metadata.ps1
  architecture-regressions:
    name: architecture-regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Record candidate identity
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force artifacts/architecture-regressions | Out-Null

          $head = '${{ github.event.pull_request.head.sha || github.sha }}'

          $checkout = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git merge-base --is-ancestor $head HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @{ candidateHead = $head; checkout = $checkout; runId = '${{ github.run_id }}'; os = '${{ matrix.os }}' } |
          ConvertTo-Json > artifacts/architecture-regressions/identity.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Test scanner, real budget checker, and CI coverage contracts
        shell: pwsh
        run: >
          node --test --test-reporter=tap tools/tests/architectural-boundaries.test.mjs
          tools/tests/architectural-budget.test.mjs tools/tests/ci-package-coverage.test.mjs
          tools/tests/ci-hosted-parallel.test.mjs tools/tests/ci-unit-sharding.test.mjs tools/tests/ci-workflow-coverage.test.mjs
          tools/tests/package-scripts-and-tests.test.mjs 2>&1 | Tee-Object
          artifacts/architecture-regressions/full.tap

          exit $LASTEXITCODE
      - name: Verify architecture boundary registry
        run: pwsh -NoProfile -File tools/tests/test-architectural-budget-allowlist.ps1
      - name: Enforce full combined architecture budget
        run: pwsh -NoProfile -File tools/check-architectural-budget.ps1
      - name: Upload architecture regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-regressions-${{ matrix.os }}
          path: artifacts/architecture-regressions
          if-no-files-found: error
          retention-days: 7
  package-components:
    name: package-components (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Record candidate identity
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force artifacts/ci-validation | Out-Null

          $head = '${{ github.event.pull_request.head.sha || github.sha }}'

          $checkout = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git merge-base --is-ancestor $head HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @{ candidateHead = $head; checkout = $checkout; runId = '${{ github.run_id }}'; os = '${{ runner.os }}'; role
          = 'package-components' } | ConvertTo-Json > artifacts/ci-validation/identity.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Prepare package component artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci-package | Out-Null
      - name: Run portable package components
        id: package_component
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          Remove-Item Env:NO_COLOR -ErrorAction SilentlyContinue

          $package = Get-Content package.json -Raw | ConvertFrom-Json

          $components = @($package.scripts.test -split '\s*&&\s*' | ForEach-Object {
            if ($_ -notmatch '^npm run ([a-z0-9:-]+)$') { throw 'Unexpected canonical package component' }
            $Matches[1]
          })

          if ($components -notcontains 'test:unit' -or $components -notcontains 'test:smoke-fixtures') { throw
          'Canonical unit/smoke components are missing' }

          $portable = @($components | Where-Object { $_ -notin @('test:unit', 'test:smoke-fixtures') })

          if ($portable.Count -eq 0) { throw 'Portable package component selection is empty' }

          $results = @()

          $failure = 0

          foreach ($suite in $portable) {
            $started = Get-Date
            $log = '../artifacts/ci-package/' + $suite.Replace(':', '-') + '.log'
            npm run $suite 2>&1 | Tee-Object $log
            $code = $LASTEXITCODE
            $results += @{ suite = $suite; exitCode = $code; elapsedSeconds = ((Get-Date) - $started).TotalSeconds }
            ConvertTo-Json -InputObject @($results) | Set-Content ../artifacts/ci-package/results.json
            if ($code -ne 0 -and $failure -eq 0) { $failure = $code }
          }

          exit $failure
        working-directory: babel-cli
      - name: Upload portable package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ matrix.os }}
          path: |-
            artifacts/ci-package
            artifacts/ci-validation
          if-no-files-found: error
          retention-days: 7
  linux-validation:
    name: linux-validation
    if: always()
    runs-on: ubuntu-latest
    needs:
      - security
      - public-content-policy
      - architecture-regressions
      - package-components
      - consumer-artifact
      - unit-shards
      - docker-smoke
      - platform-core
      - harness-runtime
      - chat-truth
      - remote-ui-browser
    steps:
      - name: Require every coverage dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = $env:NEEDS_JSON | ConvertFrom-Json
          $dependencies = @($results.PSObject.Properties)
          if ($dependencies.Count -eq 0) { throw 'Required CI dependencies are missing' }
          foreach ($dependency in $dependencies) {
            if ($dependency.Value.result -ne 'success') { throw "Required CI dependency $($dependency.Name) concluded $($dependency.Value.result)" }
          }
  windows-portability:
    name: windows-portability
    if: always()
    runs-on: windows-latest
    needs:
      - security
      - public-content-policy
      - architecture-regressions
      - package-components
      - consumer-artifact
      - unit-shards
      - docker-smoke
      - platform-core
      - harness-runtime
      - chat-truth
      - windows-policy
    steps:
      - name: Require every coverage dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = $env:NEEDS_JSON | ConvertFrom-Json
          $dependencies = @($results.PSObject.Properties)
          if ($dependencies.Count -eq 0) { throw 'Required CI dependencies are missing' }
          foreach ($dependency in $dependencies) {
            if ($dependency.Value.result -ne 'success') { throw "Required CI dependency $($dependency.Name) concluded $($dependency.Value.result)" }
          }
  platform-core:
    name: platform-core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      BABEL_TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Record candidate identity
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force artifacts/ci-validation | Out-Null

          $head = '${{ github.event.pull_request.head.sha || github.sha }}'

          $checkout = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git merge-base --is-ancestor $head HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @{ candidateHead = $head; checkout = $checkout; runId = '${{ github.run_id }}'; os = '${{ runner.os }}'; role
          = 'platform-core' } | ConvertTo-Json > artifacts/ci-validation/identity.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Run required review control-plane PowerShell contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @(
            'tools/tests/test-agent-pr-gate-closure.ps1',
            'tools/tests/test-review-evidence-taxonomy.ps1',
            'tools/tests/test-agent-pr-merge.ps1',
            'tools/tests/test-trusted-control-plane-integration.ps1'
          )) {
            pwsh -NoProfile -NonInteractive -File $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        if: matrix.os == 'ubuntu-latest'
      - name: Test merge control and Git readiness
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/tests/test-agent-pr-gate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/tests/test-agent-git-readiness.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/tests/test-trusted-control-plane-integration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if: matrix.os == 'windows-latest'
      - name: Run required review control-plane TypeScript contract
        run: >
          npx tsx --no-warnings=ExperimentalWarning --test src/services/reviewControlPlaneParity.test.ts
          src/services/reviewPolicy.test.ts src/services/babelReviewSnapshot.test.ts
          src/services/mergeReadinessBroker.test.ts src/services/reviewIndependence.test.ts
          src/services/harnessReviewProtocol.test.ts src/services/independentReviewEvidenceV3.test.ts
          src/services/codexHarnessReview.test.ts src/services/openCodeHarnessReview.test.ts
          src/services/controllerMediatedHarnessReview.test.ts src/services/trustedReviewInstallation.test.ts
        working-directory: babel-cli
        if: matrix.os == 'ubuntu-latest'
      - name: Typecheck CLI
        run: npm run typecheck
        working-directory: babel-cli
      - name: Build CLI
        run: npm run build
        working-directory: babel-cli
      - name: Check harness architecture package
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/check-harness-architecture.ps1
      - name: Run required UI test suite
        run: npm run test:ui
        working-directory: babel-cli
      - name: Run required harness acceptance suite
        run: npm run test:harness-acceptance
        working-directory: babel-cli
      - name: Run required Acceptance V0 suite
        run: npm run test:acceptance-v0
        working-directory: babel-cli
      - name: Run required benchmark/eval suite
        run: npm run test:benchmark-eval
        working-directory: babel-cli
      - name: Validate catalog
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/validate-catalog.ps1
      - name: Upload candidate identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-platform-core-${{ runner.os }}
          path: artifacts/ci-validation
          if-no-files-found: error
          retention-days: 7
  harness-runtime:
    name: harness-runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      BABEL_TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Record candidate identity
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force artifacts/ci-validation | Out-Null

          $head = '${{ github.event.pull_request.head.sha || github.sha }}'

          $checkout = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git merge-base --is-ancestor $head HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @{ candidateHead = $head; checkout = $checkout; runId = '${{ github.run_id }}'; os = '${{ runner.os }}'; role
          = 'harness-runtime' } | ConvertTo-Json > artifacts/ci-validation/identity.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Capture required harness runtime selection
        run: node scripts/capture_required_tap_selection.mjs harness-runtime
        working-directory: babel-cli
      - name: Run required harness runtime suite
        id: harness_runtime
        timeout-minutes: 15
        shell: pwsh
        run: >
          New-Item -ItemType Directory -Force artifacts/harness-runtime | Out-Null

          npm run test:harness-runtime -- --test-timeout=60000 2>&1 | Tee-Object -FilePath
          artifacts/harness-runtime/full.tap

          exit $LASTEXITCODE
        working-directory: babel-cli
      - name: Summarize harness runtime TAP (Linux)
        if: >-
          matrix.os == 'ubuntu-latest' && (always() && steps.harness_runtime.outcome != 'skipped' &&
          steps.harness_runtime.outcome != '')
        run: node scripts/summarize_required_tap.mjs harness-runtime
        working-directory: babel-cli
      - name: Upload harness runtime TAP (Linux)
        if: >-
          matrix.os == 'ubuntu-latest' && (always() && steps.harness_runtime.outcome != 'skipped' &&
          steps.harness_runtime.outcome != '')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-runtime-linux
          path: babel-cli/artifacts/harness-runtime
          if-no-files-found: warn
      - name: Summarize harness runtime TAP (Windows)
        if: >-
          matrix.os == 'windows-latest' && (always() && steps.harness_runtime.outcome != 'skipped' &&
          steps.harness_runtime.outcome != '')
        run: node scripts/summarize_required_tap.mjs harness-runtime
        working-directory: babel-cli
      - name: Upload harness runtime TAP (Windows)
        if: >-
          matrix.os == 'windows-latest' && (always() && steps.harness_runtime.outcome != 'skipped' &&
          steps.harness_runtime.outcome != '')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-runtime-windows
          path: babel-cli/artifacts/harness-runtime
          if-no-files-found: warn
      - name: Upload candidate identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-harness-runtime-${{ runner.os }}
          path: artifacts/ci-validation
          if-no-files-found: error
          retention-days: 7
  chat-truth:
    name: chat-truth (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      BABEL_TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Record candidate identity
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force artifacts/ci-validation | Out-Null

          $head = '${{ github.event.pull_request.head.sha || github.sha }}'

          $checkout = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git merge-base --is-ancestor $head HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @{ candidateHead = $head; checkout = $checkout; runId = '${{ github.run_id }}'; os = '${{ runner.os }}'; role
          = 'chat-truth' } | ConvertTo-Json > artifacts/ci-validation/identity.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Capture Chat truth test selection
        run: node scripts/capture_required_tap_selection.mjs chat-truth
        working-directory: babel-cli
      - name: Run required Chat truth suite
        id: chat_truth
        shell: pwsh
        run: |
          npm run test:chat-truth 2>&1 | Tee-Object -FilePath artifacts/chat-truth/full.tap
          exit $LASTEXITCODE
        working-directory: babel-cli
      - name: Summarize Chat truth TAP (Linux)
        if: >-
          matrix.os == 'ubuntu-latest' && (always() && steps.chat_truth.outcome != 'skipped' && steps.chat_truth.outcome
          != '')
        run: node scripts/summarize_required_tap.mjs chat-truth
        working-directory: babel-cli
      - name: Upload Chat truth selection and TAP (Linux)
        if: >-
          matrix.os == 'ubuntu-latest' && (always() && steps.chat_truth.outcome != 'skipped' && steps.chat_truth.outcome
          != '')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-truth-linux
          path: babel-cli/artifacts/chat-truth
          if-no-files-found: warn
      - name: Summarize Chat truth TAP (Windows)
        if: >-
          matrix.os == 'windows-latest' && (always() && steps.chat_truth.outcome != 'skipped' &&
          steps.chat_truth.outcome != '')
        run: node scripts/summarize_required_tap.mjs chat-truth
        working-directory: babel-cli
      - name: Upload Chat truth selection and TAP (Windows)
        if: >-
          matrix.os == 'windows-latest' && (always() && steps.chat_truth.outcome != 'skipped' &&
          steps.chat_truth.outcome != '')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-truth-windows
          path: babel-cli/artifacts/chat-truth
          if-no-files-found: warn
      - name: Upload candidate identity
        if: always()
