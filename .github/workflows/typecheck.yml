  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Record candidate identity
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force artifacts/ci-validation | Out-Null

          $head = '${{ github.event.pull_request.head.sha || github.sha }}'

          $checkout = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git merge-base --is-ancestor $head HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @{ candidateHead = $head; checkout = $checkout; runId = '${{ github.run_id }}'; os = '${{ runner.os }}'; role
          = 'docker-smoke' } | ConvertTo-Json > artifacts/ci-validation/identity.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: babel-cli
      - name: Prepare smoke evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci-package | Out-Null
          Remove-Item Env:NO_COLOR -ErrorAction SilentlyContinue
          if (Test-Path Env:BABEL_ALLOW_HOST_FALLBACK) { throw 'Host fallback must remain unset' }
          if (Test-Path Env:BABEL_DOCKER_DISABLE) { throw 'Docker disable must remain unset' }
      - name: Prepare isolated Ubuntu Docker smoke
        id: docker_prepare
        shell: bash
        run: |
          set -euo pipefail
          docker info
          NODE_DIGEST=sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
          IMAGE_REF=
          for REGISTRY in public.ecr.aws/docker/library docker.io/library; do
            if docker pull "${REGISTRY}/node@${NODE_DIGEST}"; then
              IMAGE_REF="${REGISTRY}/node@${NODE_DIGEST}"
              break
            fi
          done
          if [ -z "$IMAGE_REF" ]; then
            echo "Failed to pull pinned Node image from all registries" >&2
            exit 1
          fi
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"
      - name: Run isolated Ubuntu smoke fixtures
        id: docker_smoke
        env:
          BABEL_BENCHMARK_DOCKER_IMAGE: ${{ steps.docker_prepare.outputs.image_ref }}
          BABEL_BENCHMARK_DOCKER_EXTRA_ARGS: --user ${{ steps.docker_prepare.outputs.uid }}:${{ steps.docker_prepare.outputs.gid }}
        shell: pwsh
        run: |
          npm run test:smoke-fixtures 2>&1 | Tee-Object ../artifacts/ci-package/full.log
          exit $LASTEXITCODE
        working-directory: babel-cli
      - name: Upload isolated smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-smoke-linux
          path: |-
            artifacts/ci-package
            artifacts/ci-validation
          if-no-files-found: error
          retention-days: 7
  unit-shards:
    name: unit-shards (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        shard:
          - 0
          - 1
          - 2
          - 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      FORCE_COLOR: '1'
      BABEL_TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babel-cli/package-lock.json
      - name: Record candidate identity
        shell: pwsh
        run: >
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force artifacts/ci-validation | Out-Null

          $head = '${{ github.event.pull_request.head.sha || github.sha }}'

          $checkout = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

