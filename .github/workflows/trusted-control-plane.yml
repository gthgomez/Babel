name: Trusted Control Plane

# The audit stays on pull_request_target so its check binds to the pull request
# head. Public Release Gate completion is observed through workflow_run so this
# workflow does not hold a runner in a long poll loop.
# Drafts, stacked bases, and a stale main base are not failed tests.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_run:
    workflows: ['Public Release Gate']
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  trusted-control-plane:
    name: trusted-control-plane
    if: github.event_name == 'pull_request_target'
    concurrency:
      group: trusted-control-plane-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout immutable base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Keep non-candidates out of the merge audit
        id: eligibility
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Set-Eligibility([bool]$Eligible, [string]$Reason) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "eligible=$($Eligible.ToString().ToLowerInvariant())"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $Reason
            Write-Output $Reason
          }
          if ($env:IS_DRAFT -eq 'true') {
            Set-Eligibility $false 'Draft pull request: the merge audit stays off this head.'
            exit 0
          }
          if ($env:BASE_REF -ne 'main') {
            Set-Eligibility $false "Base is $env:BASE_REF, not main. Stacked pull requests stay out of this gate."
            exit 0
          }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $main = (git rev-parse origin/main).Trim()
          $strictFreshness = $true
          $rulesets = gh api "repos/$env:GITHUB_REPOSITORY/rulesets?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            $protect = @($rulesets | Where-Object { $_.name -eq 'protect-main' -and $_.enforcement -eq 'active' })
            if ($protect.Count -eq 1) {
              $detail = gh api "repos/$env:GITHUB_REPOSITORY/rulesets/$($protect[0].id)" | ConvertFrom-Json
              if ($LASTEXITCODE -eq 0) {
                $status = @($detail.rules | Where-Object { $_.type -eq 'required_status_checks' })
                if ($status.Count -eq 1) { $strictFreshness = [bool]$status[0].parameters.strict_required_status_checks_policy }
              }
            }
          }
          if ($strictFreshness -and $env:BASE_SHA -ne $main) {
            Set-Eligibility $false 'Base SHA is behind current main while strict freshness is enabled; this is not a failed test.'
            exit 0
          }
          if (-not $strictFreshness -and $env:BASE_SHA -ne $main) {
            Set-Eligibility $true 'Stale main base with non-strict freshness: merge audit may proceed when mergeable.'
            exit 0
          }
          Set-Eligibility $true 'Head is a main merge candidate. The audit runs after Public Release Gate completes.'
      - name: Fetch exact candidate object
        if: steps.eligibility.outputs.eligible == 'true'
        shell: pwsh
        run: |
          git fetch --no-tags origin $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize candidate as data only
        if: steps.eligibility.outputs.eligible == 'true'
        shell: pwsh
        run: |
          git worktree add --detach "$env:GITHUB_WORKSPACE/candidate" $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe Public Release Gate without polling
        if: steps.eligibility.outputs.eligible == 'true'
        id: release_gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/typecheck.yml/runs?event=pull_request&head_sha=$env:HEAD_SHA&per_page=20"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read Public Release Gate runs.' }
          $parsed = $payload | ConvertFrom-Json
          $runs = @($parsed.workflow_runs | Sort-Object { [datetime]$_.updated_at } -Descending)
          $active = @($runs | Where-Object { $_.status -ne 'completed' })
          $finished = @($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -ne 'cancelled' })
          if ($finished.Count -gt 0 -and $active.Count -eq 0) {
            $latest = $finished[0]
            if ($latest.conclusion -ne 'success') {
              throw "Public Release Gate concluded $($latest.conclusion) on run $($latest.id)"
            }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'ready=true'
            Write-Output "Public Release Gate already completed: $($latest.conclusion) run $($latest.id)"
            exit 0
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'ready=false'
          Write-Output 'Public Release Gate still running; the workflow_run listener will run the merge audit.'
      - name: Run base-rooted merge audit
        if: steps.eligibility.outputs.eligible == 'true' && steps.release_gate.outputs.ready == 'true'
        shell: pwsh
        env:
          # Only the trusted base-rooted audit receives the GitHub token.
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'merge-audit.json'
          pwsh -NoProfile -NonInteractive -File scripts/trusted-merge-gate.ps1 `
            -PR ([int]$env:PR_NUMBER) `
            -BaseSha $env:BASE_SHA `
            -RepoRoot "$env:GITHUB_WORKSPACE/candidate" `
            -ReviewedHeadSha $env:HEAD_SHA `
            -AuditOnly `
            -RequireIsolatedWorktree `
            -OutputFormat json > $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -eq 0) { exit 0 }
          $parsed = Get-Content -LiteralPath $log -Raw | ConvertFrom-Json
          # Benign blockers are single-sourced in the reviewed policy file; an
          # unreadable or invalid policy fails closed to an empty allowlist so
          # every blocker stays serious.
          $benign = @()
          try {
            $auditPolicy = Get-Content -Raw -LiteralPath 'config/review-risk-policy.json' | ConvertFrom-Json
            $candidates = @($auditPolicy.auditBenignBlockers)
            $valid = $candidates.Count -gt 0 -and @($candidates | Where-Object { [string]$_ -notmatch '^[a-z_]+$' }).Count -eq 0
            if ($valid) { $benign = @($candidates | ForEach-Object { [string]$_ }) }
          } catch { $benign = @() }
          $blockers = @($parsed.blockers | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
          $serious = @($blockers | Where-Object { $benign -notcontains [string]$_ })
          if ($blockers.Count -gt 0 -and $serious.Count -eq 0) {
            $note = "Merge audit recorded no product failure: $($blockers -join ', ')."
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $note
            Write-Output $note
            exit 0
          }
          exit $code
      - name: Test trusted-root boundary
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File tools/tests/test-trust-root-boundaries.ps1 -RepoRoot .
  merge-audit-after-release-gate:
    name: trusted-control-plane
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: trusted-control-plane-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve pull request for completed release gate
        id: pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prs = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:HEAD_SHA/pulls" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($prs).Count -lt 1) { throw 'No pull request bound to release gate head.' }
          $open = @($prs | Where-Object { $_.state -eq 'open' -and $_.base.ref -eq 'main' })
          if ($open.Count -ne 1) { throw 'Release gate head is not a unique open main pull request.' }
          $pr = $open[0]
          if ([string]$pr.head.sha -ne [string]$env:HEAD_SHA) { throw 'PR head advanced past the release gate head; audit must re-run on the current head.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "number=$($pr.number)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "base_sha=$($pr.base.sha)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "head_sha=$env:HEAD_SHA"
          if ($pr.draft) { throw 'Draft pull requests stay out of the merge audit.' }
      - name: Checkout immutable base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact candidate object
        shell: pwsh
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git fetch --no-tags origin $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Materialize candidate as data only
        shell: pwsh
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git worktree add --detach "$env:GITHUB_WORKSPACE/candidate" $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Skip when the inline audit already covered this head
        id: dedupe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # A fast-completing release gate lets the pull_request_target run audit
          # inline; this listener then fires for the same head. Only an inline
          # run whose actual audit step succeeded counts as coverage — a skipped
          # audit still concludes the workflow successfully.
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/trusted-control-plane.yml/runs?event=pull_request_target&head_sha=$env:HEAD_SHA&per_page=20" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read trusted-control-plane runs for dedupe.' }
          $inline = @($runs.workflow_runs | Where-Object { $_.event -eq 'pull_request_target' -and $_.head_sha -eq $env:HEAD_SHA -and $_.conclusion -eq 'success' })
          foreach ($run in $inline) {
            $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/jobs?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Unable to read jobs of inline audit run $($run.id)." }
            $audited = @($jobs.jobs | ForEach-Object { $_ } | Where-Object {
              @($_.steps | ForEach-Object { $_ } | Where-Object { $_.name -eq 'Run base-rooted merge audit' -and $_.conclusion -eq 'success' }).Count -gt 0
            })
            if ($audited.Count -gt 0) {
              Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'skip=true'
              Write-Output "Inline audit already succeeded for this head (run $($run.id)); skipping duplicate audit."
              exit 0
            }
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'skip=false'
      - name: Run base-rooted merge audit
        if: steps.dedupe.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'merge-audit.json'
          pwsh -NoProfile -NonInteractive -File scripts/trusted-merge-gate.ps1 `
            -PR ([int]$env:PR_NUMBER) `
            -BaseSha $env:BASE_SHA `
            -RepoRoot "$env:GITHUB_WORKSPACE/candidate" `
            -ReviewedHeadSha $env:HEAD_SHA `
            -AuditOnly `
            -RequireIsolatedWorktree `
            -OutputFormat json > $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($code -eq 0) { exit 0 }
          $parsed = Get-Content -LiteralPath $log -Raw | ConvertFrom-Json
          # Benign blockers are single-sourced in the reviewed policy file; an
          # unreadable or invalid policy fails closed to an empty allowlist so
          # every blocker stays serious.
          $benign = @()
          try {
            $auditPolicy = Get-Content -Raw -LiteralPath 'config/review-risk-policy.json' | ConvertFrom-Json
            $candidates = @($auditPolicy.auditBenignBlockers)
            $valid = $candidates.Count -gt 0 -and @($candidates | Where-Object { [string]$_ -notmatch '^[a-z_]+$' }).Count -eq 0
            if ($valid) { $benign = @($candidates | ForEach-Object { [string]$_ }) }
          } catch { $benign = @() }
          $blockers = @($parsed.blockers | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
          $serious = @($blockers | Where-Object { $benign -notcontains [string]$_ })
          if ($blockers.Count -gt 0 -and $serious.Count -eq 0) {
            $note = "Merge audit recorded no product failure: $($blockers -join ', ')."
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $note
            Write-Output $note
            exit 0
          }
          exit $code
  rerun-after-review:
    name: Reevaluate controller review
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.repository.owner.type == 'User' &&
      github.event.comment.user.id == github.event.repository.owner.id &&
      github.event.comment.user.type == 'User' &&
      (startsWith(github.event.comment.body, '<!-- babel-controller-independent-review-v3 -->') || startsWith(github.event.comment.body, '<!-- babel-controller-ai-reviews-v2 -->'))
    concurrency:
      group: trusted-control-plane-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A comment workflow has the default-branch SHA. Rerun the original
      # PR workflow so its result retains the original producer and commit.
      # No checkout or candidate code runs in this token-bearing job.
      - name: Rerun the matching PR audit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $pr = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pr.state -ne 'open') { throw 'Open PR metadata unavailable.' }
          $head = [string]$pr.head.sha
          if ($head -notmatch '^[0-9a-f]{40}$') { throw 'Invalid PR head.' }
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/trusted-control-plane.yml/runs?event=pull_request_target&head_sha=$head&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Trusted workflow runs unavailable.' }
          $matching = @($runs.workflow_runs | Where-Object {
            $_.event -eq 'pull_request_target' -and $_.head_sha -eq $head -and
            @($_.pull_requests).Count -eq 1 -and $_.pull_requests[0].number -eq [int]$env:PR_NUMBER
          } | Sort-Object id -Descending)
          if ($matching.Count -eq 0) { throw 'No audit run bound to this PR head.' }
          $runId = [string]$matching[0].id
          $workflowId = [string]$matching[0].workflow_id
          if ($runId -notmatch '^[1-9][0-9]*$' -or $workflowId -notmatch '^[1-9][0-9]*$') { throw 'Invalid audit identifiers.' }
          function Read-MatchingAudit {
            $value = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or [string]$value.id -ne $runId -or
                [string]$value.workflow_id -ne $workflowId -or $value.event -ne 'pull_request_target' -or $value.head_sha -ne $head -or
                @($value.pull_requests).Count -ne 1 -or $value.pull_requests[0].number -ne [int]$env:PR_NUMBER) { throw 'Audit run identity changed.' }
            return $value
          }
          function Assert-CurrentPr {
            $fresh = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $fresh.state -ne 'open' -or $fresh.head.sha -ne $head) { throw 'PR changed; review again.' }
          }
          $run = Read-MatchingAudit
          $originalAttempt = [int]$run.run_attempt
          if ($originalAttempt -lt 1) { throw 'Audit attempt unavailable.' }
          if ($run.status -ne 'completed') {
            # The active audit may have materialized missing evidence before
            # waiting for peer CI. Replace only this exact PR audit, not peers.
            Assert-CurrentPr
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/cancel" 2>&1 | Out-Null
            $cancelExit = $LASTEXITCODE
            $run = Read-MatchingAudit
            if ($cancelExit -ne 0 -and $run.status -ne 'completed') { throw 'Audit cancellation failed; no rerun requested.' }
            # Cancellation addresses a run, not an attempt. A concurrent
            # manual rerun may have advanced it before our cancel arrived;
            # settle that observed attempt too, rather than leaving it canceled.
            $originalAttempt = [int]$run.run_attempt
            # GitHub cancellation can take up to five minutes. Never force
            # cancel, and never rerun until this same attempt is terminal.
            for ($attempt = 0; $attempt -lt 72 -and $run.status -ne 'completed'; $attempt++) {
              Start-Sleep -Seconds 5
              $run = Read-MatchingAudit
              if ([int]$run.run_attempt -gt $originalAttempt) { Write-Output 'Another refresh already advanced the audit.'; return }
            }
          }
          if ($run.status -ne 'completed') { throw 'Audit cancellation did not settle within the bounded wait.' }
          Assert-CurrentPr
          $run = Read-MatchingAudit
          if ([int]$run.run_attempt -gt $originalAttempt -or $run.status -ne 'completed') { Write-Output 'A concurrent audit refresh is already scheduled.'; return }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/rerun" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $run = Read-MatchingAudit
            if ([int]$run.run_attempt -le $originalAttempt -and $run.status -eq 'completed') { throw 'Audit rerun request failed.' }
            Write-Output 'A concurrent audit refresh was observed; no duplicate rerun requested.'
          }
