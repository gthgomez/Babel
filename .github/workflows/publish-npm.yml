name: Publish npm package

# Publishes babel-harness to the npm registry via npm trusted publishing
# (OIDC) - no stored npm token. Requires the one-time npmjs.com binding:
# babel-harness -> gthgomez/Babel, workflow publish-npm.yml, environment
# left blank. Provenance is generated from the repository build.
#
# Publish is a consequential, owner-authorized distribution act: it fires
# automatically on a GitHub release being PUBLISHED (not drafted) and can
# also be run manually against an existing tag with dry-run first.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish (e.g. v0.1.1)"
        required: true
        type: string
      dry_run:
        description: "Pack and validate without publishing"
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish babel-harness to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve exact annotated release tag before project execution
        id: tag
        env:
          RAW_REF: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Copy-Item tools/resolve-release-tag.mjs "$env:RUNNER_TEMP/resolve-release-tag.mjs"
          node "$env:RUNNER_TEMP/resolve-release-tag.mjs" --repository "$env:GITHUB_REPOSITORY" --tag "$env:RAW_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check out frozen tag commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ steps.tag.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify package version matches the tag
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./babel-cli/package.json').version")
          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::babel-cli version $PKG_VERSION does not match tag $EXPECTED_VERSION"
            exit 1
          fi
          echo "version OK: $PKG_VERSION"

      - name: Verify frozen source and package version before lifecycle code
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_OBJECT: ${{ steps.tag.outputs.tag_object_sha }}
          RELEASE_SOURCE: ${{ steps.tag.outputs.source_sha }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:RELEASE_SOURCE) { throw 'Checkout does not match frozen release source' }
          $package = Get-Content babel-cli/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $env:RELEASE_VERSION) { throw 'Package version does not match exact tag' }
          node "$env:RUNNER_TEMP/resolve-release-tag.mjs" --repository "$env:GITHUB_REPOSITORY" --tag "$env:RELEASE_TAG" --expect-object "$env:RELEASE_OBJECT" --expect-source "$env:RELEASE_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install CLI dependencies
        run: npm --prefix babel-cli ci

      - name: Common validated package for dry run and publication
        id: pack
        shell: pwsh
        run: |
          npm --prefix babel-cli run package:release -- "$env:RUNNER_TEMP/npm-candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}

      - name: Revalidate tag object and source before promotion
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_OBJECT: ${{ steps.tag.outputs.tag_object_sha }}
          RELEASE_SOURCE: ${{ steps.tag.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          node "$env:RUNNER_TEMP/resolve-release-tag.mjs" --repository "$env:GITHUB_REPOSITORY" --tag "$env:RELEASE_TAG" --expect-object "$env:RELEASE_OBJECT" --expect-source "$env:RELEASE_SOURCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish the validated archive (or finish dry run)
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ARCHIVE_NAME: ${{ steps.pack.outputs.archive }}
          EXPECTED_DIGEST: ${{ steps.pack.outputs.sha256 }}
          EXPECTED_SOURCE: ${{ steps.tag.outputs.source_sha }}
          PACK_SOURCE: ${{ steps.pack.outputs.source_sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PACK_SOURCE -ne $env:EXPECTED_SOURCE) { throw 'Package source does not match frozen tag' }
          $archive = Join-Path "$env:RUNNER_TEMP/npm-candidate" $env:ARCHIVE_NAME
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $env:EXPECTED_DIGEST) { throw 'Validated package bytes changed before promotion' }
          if ($env:DRY_RUN -eq 'true') { Write-Output 'Common package validation complete; dry run performs no publication'; exit 0 }
          npm publish $archive --provenance --access public --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify publication
        if: ${{ inputs.dry_run != true }}
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
          EXPECTED_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            $observed = npm view "babel-harness@$env:EXPECTED_VERSION" version dist.integrity --json 2>$null
            if ($LASTEXITCODE -eq 0) {
              $result = ($observed -join "`n") | ConvertFrom-Json
              if ($result.version -eq $env:EXPECTED_VERSION -and $result.'dist.integrity' -eq $env:EXPECTED_INTEGRITY) { exit 0 }
              throw 'Published version has different immutable package integrity'
            }
            if ($attempt -lt 6) { Start-Sleep -Seconds 10 }
          }
          throw 'Publication integrity unavailable after bounded retries'
